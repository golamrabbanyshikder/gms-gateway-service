<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-fingerprint"></i> Biometric Verification</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/biometric/verify}" method="post" enctype="multipart/form-data">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="biometricId" class="form-label">Biometric ID</label>
                        <input type="number" class="form-control" id="biometricId" name="biometricId" required>
                    </div>
                    <div class="col-md-6">
                        <label for="biometricFile" class="form-label">Biometric Sample File</label>
                        <input type="file" class="form-control" id="biometricFile" name="biometricFile" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check-circle"></i> Verify
                        </button>
                    </div>
                </div>
            </form>

            <div th:if="${result != null}" class="mt-4">
                <div th:if="${result.matched}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Match confirmed (confidence: <span th:text="${result.confidenceScore}"></span>)
                    - Patient ID: <span th:text="${result.patientId}"></span>
                </div>
                <div th:unless="${result.matched}" class="alert alert-danger">
                    <i class="fas fa-times-circle"></i> No match - <span th:text="${result.message}"></span>
                </div>
            </div>
            <div th:if="${error}" class="alert alert-danger mt-4">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>
        </div>
    </div>
</div>
