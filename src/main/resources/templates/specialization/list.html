<div class="container-fluid">
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-stethoscope"></i> Add Specialization</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">
                Doctors pick from this list when being registered or edited, instead of typing free text that can
                drift into inconsistent spellings (e.g. "Cardiologist" vs "cardiology").
            </p>

            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/specializations/create}" method="post" class="row g-2">
                <div class="col-auto">
                    <input type="text" class="form-control" name="name" placeholder="e.g. Cardiologist" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-list"></i> Specializations</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Added</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(specializations)}">
                            <td colspan="3" class="text-center text-muted">No specializations added yet</td>
                        </tr>
                        <tr th:each="specialization : ${specializations}">
                            <td th:text="${specialization.name}"></td>
                            <td th:text="${#temporals.format(specialization.createdAt, 'dd MMM yyyy, hh:mm a')}"></td>
                            <td>
                                <a th:href="@{/specializations/edit/{id}(id=${specialization.specializationId})}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <form th:action="@{/specializations/delete/{id}(id=${specialization.specializationId})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this specialization? Doctors already using it keep their existing value, but it will no longer be selectable.');">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
