<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-stethoscope"></i> Doctor Management</h5>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-auto ms-auto">
                    <a th:href="@{/doctors/create}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Doctor
                    </a>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Hospital</th>
                            <th>License No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(doctors)}">
                            <td colspan="6" class="text-center text-muted">No doctors found</td>
                        </tr>
                        <tr th:each="doctor : ${doctors}">
                            <td th:text="${doctor.doctorId}"></td>
                            <td th:text="${doctor.name}"></td>
                            <td><span class="badge bg-info" th:text="${doctor.specialization}"></span></td>
                            <td th:text="${hospitalNames.get(doctor.hospitalId) != null ? hospitalNames.get(doctor.hospitalId) : ('Hospital #' + doctor.hospitalId)}"></td>
                            <td th:text="${doctor.licenseNumber}"></td>
                            <td>
                                <a th:href="@{/doctors/view/{id}(id=${doctor.doctorId})}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/doctors/edit/{id}(id=${doctor.doctorId})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
