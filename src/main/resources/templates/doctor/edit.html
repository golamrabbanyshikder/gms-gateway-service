<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-edit"></i> Edit Doctor</h5>
        </div>
        <div class="card-body">
            <div th:if="${doctor == null}" class="alert alert-warning">Doctor not found.</div>
            <form th:if="${doctor != null}" th:action="@{/doctors/edit/{id}(id=${doctorId})}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" th:value="${doctor.name}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="specialization" class="form-label">Specialization</label>
                        <select class="form-control" id="specialization" name="specialization" required>
                            <option value="">Select Specialization</option>
                            <option th:each="spec : ${specializations}" th:value="${spec.name}" th:text="${spec.name}"
                                    th:selected="${spec.name == doctor.specialization}"></option>
                        </select>
                        <small class="text-muted">
                            Not in the list? <a th:href="@{/specializations}">Manage specializations</a>.
                        </small>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="licenseNumber" class="form-label">License Number</label>
                        <input type="text" class="form-control" id="licenseNumber" name="licenseNumber" th:value="${doctor.licenseNumber}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Doctor
                        </button>
                        <a th:href="@{/doctors}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
