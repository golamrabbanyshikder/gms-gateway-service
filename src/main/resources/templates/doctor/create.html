<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-stethoscope"></i> Register Doctor</h5>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>
            <form th:action="@{/doctors/create}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="specialization" class="form-label">Specialization</label>
                        <select class="form-control" id="specialization" name="specialization" required>
                            <option value="">Select Specialization</option>
                            <option th:each="spec : ${specializations}" th:value="${spec.name}" th:text="${spec.name}"></option>
                        </select>
                        <small class="text-muted">
                            Not in the list? <a th:href="@{/specializations}">Manage specializations</a>.
                        </small>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="hospitalId" class="form-label">Hospital</label>
                        <select class="form-control" id="hospitalId" name="hospitalId" required>
                            <option value="">Select Hospital</option>
                            <option th:each="hospital : ${hospitals}" th:value="${hospital.hospitalId}"
                                    th:text="${hospital.hospitalName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="licenseNumber" class="form-label">License Number</label>
                        <input type="text" class="form-control" id="licenseNumber" name="licenseNumber" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Register Doctor
                        </button>
                        <a th:href="@{/doctors}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
