<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Global Medical System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(6, 57, 112, 0.12);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h3 class="mb-4"><i class="fas fa-check-circle"></i> Verify OTP</h3>
        
        <p class="text-muted mb-4">Enter the OTP sent to your email</p>

        <form th:action="@{/verify-otp}" method="post">
            <div class="mb-3">
                <label for="otp" class="form-label">OTP Code</label>
                <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp" 
                       required placeholder="000000" maxlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fas fa-check"></i> Verify OTP
            </button>
        </form>

        <div class="text-center">
            <small><a th:href="@{/forgot-password}" class="text-decoration-none">Resend OTP</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
