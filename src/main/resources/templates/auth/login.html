<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Global Medical System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(6, 57, 112, 0.12);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #E2E8F0;
        }
        .gms-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .gms-logo i {
            font-size: 48px;
            color: #00A8A8;
        }
        .gms-logo h2 {
            color: #1E293B;
            margin-top: 10px;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #E2E8F0;
        }
        .form-control:focus {
            border-color: #0B5ED7;
            box-shadow: 0 0 0 0.2rem rgba(11, 94, 215, 0.25);
        }
        .btn-login {
            background: #0B5ED7;
            border: none;
            border-radius: 5px;
            padding: 10px;
            font-weight: bold;
        }
        .btn-login:hover {
            background: #063970;
        }
        .forgot-link {
            text-align: center;
            margin-top: 15px;
        }
        .forgot-link a {
            color: #0B5ED7;
            text-decoration: none;
        }
        .forgot-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="gms-logo">
            <i class="fas fa-hospital"></i>
            <h2>GMS</h2>
            <p class="text-muted">Global Medical System</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post" class="needs-validation">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe">
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-login w-100 text-white mb-3">
                <i class="fas fa-sign-in-alt"></i> LOGIN
            </button>
        </form>

        <div class="forgot-link">
            <a th:href="@{/forgot-password}">
                <i class="fas fa-key"></i> Forgot Password?
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
