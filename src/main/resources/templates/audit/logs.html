<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-history"></i> Audit & Activity Log</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Entity</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(auditLogs)}">
                            <td colspan="5" class="text-center text-muted">No audit logs found</td>
                        </tr>
                        <tr th:each="audit : ${auditLogs}">
                            <td th:text="${#temporals.format(audit.createdAt, 'dd MMM yyyy, hh:mm a')}"></td>
                            <td th:text="${audit.username}"></td>
                            <td><strong th:text="${audit.action}"></strong></td>
                            <td><span class="badge bg-info" th:text="${audit.entityType} + ' #' + ${audit.entityId}"></span></td>
                            <td th:text="${audit.details}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
