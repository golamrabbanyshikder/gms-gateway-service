<div class="container-fluid">
    <div class="card border-success">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="fas fa-check-circle"></i> Your Appointment is Confirmed</h5>
        </div>
        <div class="card-body">
            <div class="alert alert-success">
                <i class="fas fa-calendar-check"></i>
                We have received your appointment request.
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h6 class="text-secondary">Doctor</h6>
                    <p th:text="${doctorName}">Doctor</p>
                </div>
                <div class="col-md-6">
                    <h6 class="text-secondary">Hospital</h6>
                    <p th:text="${hospitalName}">Hospital</p>
                </div>
                <div class="col-md-12">
                    <h6 class="text-secondary">Appointment Time</h6>
                    <p>
                        <strong th:text="${#temporals.format(appointment.appointmentDate, 'EEEE, dd MMM yyyy')}">Date</strong>
                        &nbsp;at&nbsp;
                        <strong th:text="${#temporals.format(appointment.startTime, 'HH:mm') + ' - ' + #temporals.format(appointment.endTime, 'HH:mm')}">Time</strong>
                    </p>
                </div>
                <div class="col-md-12" th:if="${appointment.reasonForVisit != null and appointment.reasonForVisit != ''}">
                    <h6 class="text-secondary">Reason</h6>
                    <p th:text="${appointment.reasonForVisit}">Reason</p>
                </div>
            </div>
            <hr>
            <div>
                <a th:href="@{/patient/dashboard}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Back to Dashboard
                </a>
                <a th:href="@{/patient/booking/list}" class="btn btn-secondary">
                    <i class="fas fa-list"></i> View My Appointments
                </a>
            </div>
        </div>
    </div>
</div>
