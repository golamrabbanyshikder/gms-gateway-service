<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div th:if="${patient == null}" class="alert alert-warning">
                Your patient record could not be loaded right now. Please try again later.
            </div>
            <div th:if="${patient != null}" class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-user-circle"></i> My Information</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span th:text="${patient.fullName}"></span></p>
                            <p><strong>National ID:</strong> <span th:text="${patient.nationalId}"></span></p>
                            <p><strong>DOB:</strong> <span th:text="${#temporals.format(patient.dateOfBirth, 'dd MMM yyyy')}"></span></p>
                            <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Blood Group:</strong> <span th:text="${patient.bloodGroup}"></span></p>
                            <p><strong>Contact:</strong> <span th:text="${patient.mobileNo}"></span></p>
                            <p><strong>Address:</strong> <span th:text="${patient.address}"></span></p>
                        </div>
                    </div>
                    <a th:href="@{/patient/history}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-history"></i> View My History
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
