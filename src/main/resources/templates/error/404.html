<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-container { text-align: center; color: #F8FAFC; }
        .error-code { font-size: 120px; font-weight: bold; color: #F59E0B; }
        .error-message { font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-message"><i class="fas fa-search"></i> Page Not Found</div>
        <p class="mb-4">The page you're looking for doesn't exist.</p>
        <a th:href="@{/dashboard}" class="btn btn-light">
            <i class="fas fa-home"></i> Go to Dashboard
        </a>
    </div>
</body>
</html>
