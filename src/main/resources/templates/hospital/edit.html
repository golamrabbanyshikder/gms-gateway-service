<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-edit"></i> Edit Hospital</h5>
        </div>
        <div class="card-body">
            <div th:if="${hospital == null}" class="alert alert-warning">Hospital not found.</div>
            <form th:if="${hospital != null}" th:action="@{/hospitals/edit/{id}(id=${hospitalId})}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="hospitalName" class="form-label">Hospital Name</label>
                        <input type="text" class="form-control" id="hospitalName" name="hospitalName" th:value="${hospital.hospitalName}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" name="city" th:value="${hospital.city}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="contactNumber" class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" id="contactNumber" name="contactNumber" th:value="${hospital.contactNumber}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" name="address" th:value="${hospital.address}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Hospital
                        </button>
                        <a th:href="@{/hospitals}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
