<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <div class="row align-items-center">
                <div class="col">
                    <h5 class="mb-0"><i class="fas fa-hospital"></i> Hospital Management</h5>
                </div>
                <div class="col-auto">
                    <a th:href="@{/hospitals/create}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Hospital
                    </a>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-12">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Hospital Name</th>
                                    <th>City</th>
                                    <th>Contact</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(hospitals)}">
                                    <td colspan="5" class="text-center text-muted">No hospitals found</td>
                                </tr>
                                <tr th:each="hospital : ${hospitals}">
                                    <td th:text="${hospital.hospitalId}"></td>
                                    <td th:text="${hospital.hospitalName}"></td>
                                    <td th:text="${hospital.city}"></td>
                                    <td th:text="${hospital.contactNumber}"></td>
                                    <td>
                                        <a th:href="@{/hospitals/view/{id}(id=${hospital.hospitalId})}" class="btn btn-sm btn-info">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/hospitals/edit/{id}(id=${hospital.hospitalId})}" class="btn btn-sm btn-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
