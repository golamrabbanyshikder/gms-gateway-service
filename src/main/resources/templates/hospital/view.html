<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div th:if="${hospital == null}" class="alert alert-warning">Hospital not found.</div>
            <div th:if="${hospital != null}" class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-hospital"></i> Hospital Details</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Hospital ID:</strong> <span th:text="${hospital.hospitalId}"></span></p>
                            <p><strong>Name:</strong> <span th:text="${hospital.hospitalName}"></span></p>
                            <p><strong>City:</strong> <span th:text="${hospital.city}"></span></p>
                            <p><strong>State:</strong> <span th:text="${hospital.state}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Address:</strong> <span th:text="${hospital.address}"></span></p>
                            <p><strong>Zip Code:</strong> <span th:text="${hospital.zipCode}"></span></p>
                            <p><strong>Contact:</strong> <span th:text="${hospital.contactNumber}"></span></p>
                        </div>
                    </div>
                    <a th:href="@{/hospitals/branches}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-code-branch"></i> Branches
                    </a>
                    <a th:href="@{/hospitals/departments}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-sitemap"></i> Departments
                    </a>
                    <a th:href="@{/hospitals/edit/{id}(id=${hospital.hospitalId})}" class="btn btn-warning btn-sm">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a th:href="@{/hospitals}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-arrow-left"></i> Back to List
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
