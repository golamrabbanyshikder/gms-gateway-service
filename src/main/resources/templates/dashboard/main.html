<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0">Total Patients</h6>
                            <h3 class="mb-0" th:text="${totalPatients}">0</h3>
                        </div>
                        <i class="fas fa-users fa-3x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0">Today's Patients</h6>
                            <h3 class="mb-0" th:text="${todaysPatients}">0</h3>
                        </div>
                        <i class="fas fa-user-md fa-3x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0">Total Doctors</h6>
                            <h3 class="mb-0" th:text="${totalDoctors}">0</h3>
                        </div>
                        <i class="fas fa-stethoscope fa-3x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0">Reports Uploaded</h6>
                            <h3 class="mb-0" th:text="${reportsUploaded}">0</h3>
                        </div>
                        <i class="fas fa-file-medical fa-3x opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-chart-line"></i> Patient Growth</h5>
                </div>
                <div class="card-body">
                    <canvas id="patientGrowthChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-prescription-bottle"></i> Monthly Prescriptions</h5>
                </div>
                <div class="card-body">
                    <canvas id="prescriptionChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-history"></i> Recent Activities</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(recentActivities)}">
                                    <td colspan="4" class="text-center text-muted">No recent activity</td>
                                </tr>
                                <tr th:each="activity : ${recentActivities}">
                                    <td th:text="${#temporals.format(activity.createdAt, 'dd MMM yyyy, hh:mm a')}"></td>
                                    <td th:text="${activity.username}"></td>
                                    <td th:text="${activity.action}"></td>
                                    <td th:text="${activity.details}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
    var patientGrowthLabels = /*[[${patientGrowthLabels}]]*/ [];
    var patientGrowthData = /*[[${patientGrowthData}]]*/ [];
    var prescriptionLabels = /*[[${monthlyPrescriptionsLabels}]]*/ [];
    var prescriptionData = /*[[${monthlyPrescriptionsData}]]*/ [];

    new Chart(document.getElementById('patientGrowthChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: patientGrowthLabels,
            datasets: [{
                label: 'New Patients',
                data: patientGrowthData,
                borderColor: '#0B5ED7',
                backgroundColor: 'rgba(11, 94, 215, 0.1)',
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });

    new Chart(document.getElementById('prescriptionChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: prescriptionLabels,
            datasets: [{
                label: 'Prescriptions',
                data: prescriptionData,
                backgroundColor: '#16A34A'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });
});
</script>
