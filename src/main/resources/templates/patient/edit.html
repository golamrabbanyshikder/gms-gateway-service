<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-edit"></i> Edit Patient</h5>
        </div>
        <div class="card-body">
            <div th:if="${patient == null}" class="alert alert-warning">Patient not found.</div>
            <form th:if="${patient != null}" th:action="@{/patients/edit/{id}(id=${patientId})}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" th:value="${patient.fullName}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nationalId" class="form-label">National ID</label>
                        <input type="text" class="form-control" id="nationalId" name="nationalId" th:value="${patient.nationalId}" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="dateOfBirth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" th:value="${patient.dateOfBirth}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label">Gender</label>
                        <select class="form-control" id="gender" name="gender" required>
                            <option value="Male" th:selected="${patient.gender == 'Male'}">Male</option>
                            <option value="Female" th:selected="${patient.gender == 'Female'}">Female</option>
                            <option value="Other" th:selected="${patient.gender == 'Other'}">Other</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="mobileNo" class="form-label">Mobile No</label>
                        <input type="tel" class="form-control" id="mobileNo" name="mobileNo" th:value="${patient.mobileNo}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="bloodGroup" class="form-label">Blood Group</label>
                        <select class="form-control" id="bloodGroup" name="bloodGroup" required>
                            <option value="O+" th:selected="${patient.bloodGroup == 'O+'}">O+</option>
                            <option value="O-" th:selected="${patient.bloodGroup == 'O-'}">O-</option>
                            <option value="A+" th:selected="${patient.bloodGroup == 'A+'}">A+</option>
                            <option value="A-" th:selected="${patient.bloodGroup == 'A-'}">A-</option>
                            <option value="B+" th:selected="${patient.bloodGroup == 'B+'}">B+</option>
                            <option value="B-" th:selected="${patient.bloodGroup == 'B-'}">B-</option>
                            <option value="AB+" th:selected="${patient.bloodGroup == 'AB+'}">AB+</option>
                            <option value="AB-" th:selected="${patient.bloodGroup == 'AB-'}">AB-</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" th:text="${patient.address}" required></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Patient
                        </button>
                        <a th:href="@{/patients}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
