<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <a th:href="@{/patients}" class="btn btn-outline-primary btn-sm mb-3">
                <i class="fas fa-arrow-left"></i> Back to Patient Management
            </a>
            <div th:if="${patient == null}" class="alert alert-warning">Patient not found.</div>
            <div th:if="${patient != null}" class="card">
                <div class="card-body">
                    <h6>Patient Information</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Name:</strong> <span th:text="${patient.fullName}"></span></p>
                            <p><strong>National ID:</strong> <span th:text="${patient.nationalId}"></span></p>
                            <p><strong>DOB:</strong> <span th:text="${#temporals.format(patient.dateOfBirth, 'dd MMM yyyy')}"></span></p>
                            <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Blood Group:</strong> <span th:text="${patient.bloodGroup}"></span></p>
                            <p><strong>Contact:</strong> <span th:text="${patient.mobileNo}"></span></p>
                            <p><strong>Address:</strong> <span th:text="${patient.address}"></span></p>
                        </div>
                    </div>
                    <a th:href="@{/patients/history/{id}(id=${patient.patientId})}" class="btn btn-secondary btn-sm">
                        <i class="fas fa-history"></i> View Medical Timeline
                    </a>
                    <a th:unless="${isDoctorRole}" th:href="@{/patients/edit/{id}(id=${patient.patientId})}" class="btn btn-warning btn-sm">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
