<div class="container-fluid">
    <a th:href="@{/patients}" class="btn btn-outline-primary btn-sm mb-3">
        <i class="fas fa-arrow-left"></i> Back to Patient Management
    </a>
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-history"></i> Medical Timeline</h5>
        </div>
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="text-secondary mb-0"><i class="fas fa-prescription-bottle"></i> Prescriptions</h6>
                <div>
                    <a th:href="@{/prescriptions/upload(patientId=${patientId})}" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-upload"></i> Upload Prescription
                    </a>
                    <a th:href="@{/prescriptions/create(patientId=${patientId})}" class="btn btn-sm btn-primary">
                        <i class="fas fa-plus"></i> Add Prescription
                    </a>
                </div>
            </div>
            <div class="table-responsive mb-4 mt-2">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Doctor</th><th>Medicines</th><th>Follow-up</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(prescriptions)}">
                            <td colspan="5" class="text-center text-muted">No prescriptions found</td>
                        </tr>
                        <tr th:each="p : ${prescriptions}">
                            <td th:text="${p.prescriptionId}"></td>
                            <td th:text="${doctorNames.get(p.doctorId) != null ? doctorNames.get(p.doctorId) : ('Doctor #' + p.doctorId)}"></td>
                            <td th:text="${p.medicineList}"></td>
                            <td th:text="${#temporals.format(p.followUpDate, 'dd MMM yyyy')}"></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:attr="onclick=|showPreview('/prescriptions/preview/${p.prescriptionId}', 'Prescription #${p.prescriptionId}')|">
                                    <i class="fas fa-eye"></i> Preview
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <h6 class="text-secondary mb-0"><i class="fas fa-file-medical"></i> Reports</h6>
                <a th:href="@{/reports/upload(patientId=${patientId})}" class="btn btn-sm btn-primary">
                    <i class="fas fa-upload"></i> Upload Report
                </a>
            </div>
            <div class="table-responsive mt-2">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr><th>ID</th><th>Type</th><th>Doctor</th><th>Date</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="5" class="text-center text-muted">No reports found</td>
                        </tr>
                        <tr th:each="r : ${reports}">
                            <td th:text="${r.reportId}"></td>
                            <td th:text="${r.reportType}"></td>
                            <td th:text="${doctorNames.get(r.doctorId) != null ? doctorNames.get(r.doctorId) : ('Doctor #' + r.doctorId)}"></td>
                            <td th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy, hh:mm a')}"></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:attr="onclick=|showPreview('/reports/preview/${r.reportId}', '${r.reportType}')|">
                                    <i class="fas fa-eye"></i> Preview
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="previewModalTitle">Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" style="height: 75vh;">
                    <iframe id="previewFrame" src="" style="width: 100%; height: 100%; border: 0;"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function showPreview(url, title) {
        document.getElementById('previewFrame').src = url;
        document.getElementById('previewModalTitle').textContent = title;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('previewModal')).show();
    }
    document.getElementById('previewModal').addEventListener('hidden.bs.modal', function () {
        document.getElementById('previewFrame').src = '';
    });
</script>
