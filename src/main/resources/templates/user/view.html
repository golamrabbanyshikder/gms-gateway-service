<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div th:if="${user == null}" class="alert alert-warning">User not found.</div>
            <div th:if="${user != null}" class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="fas fa-user"></i> User Details</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>User ID:</strong> <span th:text="${user.userId}"></span></p>
                            <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                            <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
                            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Role:</strong> <span class="badge bg-primary" th:text="${user.role}"></span></p>
                            <p><strong>Status:</strong>
                                <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                                <span th:unless="${user.enabled}" class="badge bg-danger">Inactive</span>
                            </p>
                            <p><strong>Hospital ID:</strong> <span th:text="${user.hospitalId}"></span></p>
                            <p><strong>Created:</strong> <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy, hh:mm a')}"></span></p>
                        </div>
                    </div>
                    <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="btn btn-warning btn-sm">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-arrow-left"></i> Back to List
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
