<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-edit"></i> Edit User</h5>
        </div>
        <div class="card-body">
            <div th:if="${user == null}" class="alert alert-warning">User not found.</div>
            <form th:if="${user != null}" th:action="@{/users/edit/{id}(id=${userId})}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" th:value="${user.fullName}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${user.email}">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-control" id="role" name="role" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                    th:selected="${user.role != null and user.role.name() == r.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="enabled" class="form-label d-block">Status</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" th:checked="${user.enabled}">
                            <label class="form-check-label" for="enabled">Enabled</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update User
                        </button>
                        <a th:href="@{/users}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
