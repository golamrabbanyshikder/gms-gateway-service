<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-calendar-check"></i> Appointment Contact List</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">
                Doctors grouped by hospital &mdash; call the hospital's contact number to book an appointment with a doctor there.
            </p>

            <div th:if="${#lists.isEmpty(hospitals)}" class="alert alert-info">No hospitals found.</div>

            <div th:each="hospital : ${hospitals}" class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="text-primary mb-0"><i class="fas fa-hospital"></i> <span th:text="${hospital.hospitalName}"></span></h6>
                    <span class="text-muted small">
                        <i class="fas fa-phone"></i>
                        <span th:text="${hospital.contactNumber != null ? hospital.contactNumber : 'No contact number'}"></span>
                    </span>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-light">
                            <tr><th>Doctor</th><th>Specialization</th><th>License No</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="doctor : ${doctors}" th:if="${hospital.hospitalId.equals(doctor.hospitalId)}">
                                <td th:text="${doctor.name}"></td>
                                <td th:text="${doctor.specialization}"></td>
                                <td th:text="${doctor.licenseNumber}"></td>
                            </tr>
                            <tr th:if="${not #lists.contains(hospitalIdsWithDoctors, hospital.hospitalId)}">
                                <td colspan="3" class="text-center text-muted">No doctors listed at this hospital</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
