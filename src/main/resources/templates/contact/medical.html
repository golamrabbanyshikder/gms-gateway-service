<div class="container-fluid">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-address-book"></i> Medical Contact List</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">
                Doctors grouped by specialization &mdash; use this to find the right specialist for a referral or medical contact.
            </p>

            <div th:if="${#lists.isEmpty(doctors)}" class="alert alert-info">No doctors found.</div>

            <div th:each="spec : ${specializations}" class="mb-4">
                <h6 class="text-primary mb-2"><i class="fas fa-stethoscope"></i> <span th:text="${spec}"></span></h6>
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-light">
                            <tr><th>Doctor</th><th>Hospital</th><th>License No</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="doctor : ${doctors}" th:if="${spec.equals(doctor.specialization)}">
                                <td th:text="${doctor.name}"></td>
                                <td th:text="${hospitalNames.get(doctor.hospitalId) != null ? hospitalNames.get(doctor.hospitalId) : ('Hospital #' + doctor.hospitalId)}"></td>
                                <td th:text="${doctor.licenseNumber}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
