spring.application.name=gateway-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://localhost:3306/gms_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

server.port=8085
server.servlet.context-path=/

services.backend-url=http://localhost:8081
services.biometric-url=http://localhost:8082
services.filesystem-url=http://localhost:8083

# Permanent key this gateway uses to call backend/biometric/file-system-service.
# Must match each service's own internal.gateway-api-key. Override all of
# these via the same INTERNAL_API_KEY env var in production.
internal.api-key=${INTERNAL_API_KEY:gms-internal-7f3a9c2e8b1d4f6a0c5e9b3d7a1f4c8e}

# Anthropic Claude API for the agentic voice-intake path. Reads the user's
# preferred env var names so the same setup that powers local Claude Code
# drives the gateway-service JVM. Empty api-key → offline regex fallback.
#
#   ANTHROPIC_AUTH_TOKEN  → api-key (Claude Code convention; sk-cp-* tokens)
#   ANTHROPIC_BASE_URL    → custom endpoint (proxy / regional / mock)
#   ANTHROPIC_MODEL       → model name (defaults to Haiku 4.5)
#
# Production: set ANTHROPIC_API_KEY (standard Anthropic) and override
# api-url only if you proxy through a regional gateway.
anthropic.api-key=sk-cp-iHFmldX8ppHTlxnD574MtXmvy2TpwzoChmU0TmioLIioUmXIzwdAmHcRMy_ifkBY1a-HrfsRM5G1IsRmGulRGL88WeuaMT3DeiLkzNjAk4QdO4-kS5IW2Q8
anthropic.api-url=https://api.minimax.io/anthropic
anthropic.model=MiniMax-M3

logging.level.root=INFO
logging.level.com.gms=DEBUG
